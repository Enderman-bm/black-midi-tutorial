name: 自动同步侧边栏

on:
  push:
    branches: [main]
    paths:
      - 'docs/**.md'
      - 'gen_toc_from_docs.py'
      - '!docs/SUMMARY.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-summary:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 重新生成 docs/SUMMARY.md
        run: python3 gen_toc_from_docs.py

      - name: 如有变化则提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SUMMARY.md
          if git diff --cached --quiet; then
            echo "侧边栏无变化，跳过提交"
          else
            git commit -m "自动同步侧边栏：docs/SUMMARY.md"
            git push
          fi
