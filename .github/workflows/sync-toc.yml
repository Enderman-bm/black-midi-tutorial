name: 自动同步侧边栏与格式

on:
  push:
    branches: [main]
    paths:
      - 'docs/**.md'
      - 'gen_toc_from_docs.py'
      - 'fix_toc_and_spacing.py'
      - '!docs/SUMMARY.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 重新生成侧边栏
        run: python3 gen_toc_from_docs.py

      - name: 自动校正格式（标题空行、图片路径、公式写法、锚点）
        run: python3 fix_toc_and_spacing.py --apply

      - name: 如有变化则提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "自动同步侧边栏与格式规范"
            git push
          fi
