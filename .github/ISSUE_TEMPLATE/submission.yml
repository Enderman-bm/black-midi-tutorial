name: 投稿
description: 向《黑乐谱综合教程》投稿内容（支持附件上传）
title: "[投稿] "
labels: ["投稿"]
body:
  - type: markdown
    attributes:
      value: |
        感谢参与《黑乐谱综合教程》的编写！投稿前请先阅读[《编写指南》](https://github.com/IMT11D/black-midi-tutorial/blob/main/CONTRIBUTING.md)。

        - **正文严禁由 AI 工具直接撰写或改写**；AI / Agent 仅可用于格式整理与语言精练。
        - 较长的正文与图片请直接在下方输入框中**拖拽上传附件**（文档类 ≤ 25MB，图片 ≤ 10MB）。

  - type: input
    id: chapter
    attributes:
      label: 目标章节
      description: 希望投稿到哪一章、哪一节？
      placeholder: 例如：3.2.2 MIDI编辑基本操作方法
    validations:
      required: true

  - type: input
    id: position
    attributes:
      label: 插入位置
      placeholder: 例如：3.2.2 节末尾 / 新增 3.4 节
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: 作者署名
      description: 用于教程“鸣谢”，可匿名
      placeholder: 例如：XXX / 匿名
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 内容简述
      description: 简要说明投稿内容与改动意图
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 投稿确认
      options:
        - label: 我已阅读《编写指南》，确认投稿正文非 AI 工具直接撰写，并允许维护组对内容进行格式调整与技术校对
          required: true
